# 真编一个工具出来，证明构建机器还转得动 —— 手动触发 + 每月一次。
#
# 为什么不放进每次 push：要下一份官方 NDK（几百 MB）再取源码树，太重。
# 为什么必须有：ci-checks.sh 那批全是**静态检查**，一行代码都没编译过。
# 「脚本语法对」不等于「编得出东西」—— 这个仓库栽过同形的跟头
# （build-adb.sh 六步全绿，而那份 adb 根本起不了服务器）。
#
# 挑 hprof-conv：只取一棵稀疏树（dalvik/tools/hprof-conv），最便宜，
# 但走的是**完整链路** —— 取树 → cmake → 用 NDK 交叉编 → 验收跟官方产物比对。
name: smoke-build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 1 * *'   # 每月 1 号

jobs:
  build-one-tool:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld cmake ninja-build git curl unzip python3 zip

      - name: Fetch the official NDK (sysroot and manifest only)
        run: |
          # **别写死 zip 名**：r27b 这个字母会随小版本变，写死了 CI 会一直
          # 拿着旧 NDK 编，而 tools/ 里的版本已经往前走了。版本号从
          # tools/build-common.sh 读，地址问 manifest 要。
          V=$(sed -n 's/^NDK_DEFAULT_VER=//p' tools/build-common.sh | head -1)
          [ -n "$V" ] || { echo "tools/build-common.sh 里读不出 NDK_DEFAULT_VER"; exit 1; }
          echo "NDK $V" 
          tools/fetch-google-package.sh "ndk;$V" "$RUNNER_TEMP/ndk"
          echo "ANDROID_NDK_HOME=$(ls -d "$RUNNER_TEMP"/ndk/*/ | head -1 | sed 's:/$::')" >> "$GITHUB_ENV"

      - name: Shim toolchain (bootstrap)
        # **先有鸡还是先有蛋**：我们的工具都是用 NDK 编的，而官方 NDK 的 host
        # 工具链是 x86_64 的，在 ARM64 runner 上跑不起来。薄壳把系统 clang
        # 包一层当 host 工具链用，够把第一个工具编出来。见 README 第四节。
        run: tools/make-shim-toolchain.sh "$ANDROID_NDK_HOME"

      - name: Fetch the shared AOSP tree
        # hprof-conv 不自带源码：这些工具**共用一棵树**（libbase / libutils /
        # libandroidfw 都在里面），取树的活在 build-aapt2.sh 里。
        # 少了这一步，build-hprof-conv.sh 会当场死在 common_need_src ——
        # run #1 就是这么红的，而这个 workflow 从写出来到那天从没跑过，
        # 所以这个洞在里面躺了一个星期。
        run: WORK="$RUNNER_TEMP/work" tools/build-aapt2.sh --fetch
      - name: Build hprof-conv and accept it
        run: WORK="$RUNNER_TEMP/work" tools/build-hprof-conv.sh

      - name: Upstream versions (exit 10 = upstream moved, not a failure)
        # 谁盯着「上游出新版本了」？以前没人 —— hermesc 自己从 .0.16 走到 .0.17，
        # 是打包时偶然发现的。手写的「记得定期看一眼」没人会真的看。
        run: |
          set +e
          tools/check-upstream-versions.sh; rc=$?
          if [ $rc = 10 ]; then
            echo "::notice::upstream has newer versions — see the log; this is a decision, not a failure"
            exit 0
          fi
          exit $rc
      - name: Upstream patch status (exit 10 = upstream moved, not a failure)
        # 结论会过期：上游修掉某处之后，我们该做的是删补丁 + 升 tag。
        # 手写的结论没人回头复核，跑得起来的检查才会。
        run: |
          set +e
          tools/check-upstream-patches.sh; rc=$?
          if [ $rc = 10 ]; then
            echo "::warning::上游状态变了，见 patches/UPSTREAM.md"; exit 0
          fi
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hprof-conv-aarch64
          path: ${{ runner.temp }}/work/out/hprof-conv
          if-no-files-found: warn
