# 在 CI 上出发布物。手动触发。
#
# ---------------------------------------------------------------------------
# **为什么切成这么多 job**
#
# 原来的理由是「GitHub runner 只有 14 GB 盘」。**那是错的**：第一次真跑（run #1）
# 量到 runner 上还剩 **115 GB**，宽裕得很。
#
# 但分段保留，因为真正需要它的是**开发机**：根盘 45 GB、日常可用十几 GB，整条链
# 一次做完放不下。CI 跟开发机走同一套分段流程，两边才不会各长各的 —— 如果哪天
# 所有编译都只在 GitHub 上做了，这个理由才消失。
#
# 各段峰值（开发机上实测）：
#   llvm         源码 2.1 + build 3.5 + 装出来 1.7  = 7.2 GB
#   sdk-tools    源码 2.9 + build 1.5              = 4.4 GB
#   ndk-package  官方 NDK 3.9 + 工具链 1.7 + 暂存 1.1 ≈ 7 GB
#   hermesc      源码 0.24                          < 1 GB
#
# LLVM 那段装完后 PRUNE_AFTER_INSTALL=1 把 build/ 和源码删掉（实测腾 5 GB）。
#
# **另一个便宜**：host 工具（clang/lld/python/hermesc）直接跑在 ubuntu-22.04-arm 上，
# 它本身就是 glibc 2.35 —— 开发机上那套「在 ubuntu:22.04 容器里编」的机关在这儿
# 用不着，因为 runner 本身就是老发行版。
#
# run #1 实测耗时：hermesc 2 分钟、llvm 60 分钟（其中编 LLVM 56）、ndk-package
# 5 分钟（含打两次比对）。sdk-tools 那次红了，见下面 prepare-ndk.sh 的注释。

name: release-build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag to build from; artifacts are attached to its Release (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      ndk_version:
        description: 'NDK version to build for'
        default: '27.1.12297006'
      build_tools:
        description: 'Official build-tools revision to borrow the jars and wrapper scripts from'
        default: '36.0.0'
      verify_repro:
        description: 'Also package the NDK twice to prove reproducibility (doubles the time; the SDK is always checked)'
        type: boolean
        default: true
      allow_clang_skew:
        description: 'Allow a clang version mismatch (needed for r28; see docs/VERSIONS.md)'
        type: boolean
        default: false

jobs:
  llvm:
    runs-on: ubuntu-22.04-arm      # glibc 2.35 = 我们要的门槛，不用容器
    timeout-minutes: 300
    steps:
      # **必须检出 tag，不是 main**：SOURCE_DATE_EPOCH 默认取 HEAD 的提交时间，
      # 在 main 上打出来的包属于 main 那个 commit，跟 Release 对不上。
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.release_tag }}" }
      - name: Disk space (the premise this whole layout rests on)
        run: df -h / && echo "--- 可用空间就是上面 Avail 那列 ---"
      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /
      - name: Dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld cmake ninja-build git curl unzip zip python3 python3-dev
      - name: Fetch the official NDK (donor for the sysroot and the manifest)
        run: |
          tools/fetch-google-package.sh "ndk;${{ inputs.ndk_version }}" "$RUNNER_TEMP/ndk"
          echo "ANDROID_NDK_HOME=$(ls -d $RUNNER_TEMP/ndk/*/ | head -1)" >> "$GITHUB_ENV"
      - name: Build python3
        run: WORK="$RUNNER_TEMP/work" tools/build-python.sh
      - name: Build LLVM (prune the build tree once installed)
        env:
          PRUNE_AFTER_INSTALL: '1'
          ALLOW_CLANG_VER_SKEW: ${{ inputs.allow_clang_skew && '1' || '0' }}
        run: WORK="$RUNNER_TEMP/work" tools/build-llvm.sh
      - name: Pass the toolchain to the next job
        run: tar -C "$RUNNER_TEMP/work/out" -czf "$RUNNER_TEMP/toolchain.tar.gz" llvm python3
      - uses: actions/upload-artifact@v4
        with: { name: toolchain, path: "${{ runner.temp }}/toolchain.tar.gz" }

  ndk-package:
    needs: llvm
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    steps:
      # **必须检出 tag，不是 main**：SOURCE_DATE_EPOCH 默认取 HEAD 的提交时间，
      # 在 main 上打出来的包属于 main 那个 commit，跟 Release 对不上。
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.release_tag }}" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq curl unzip zip file python3
      - uses: actions/download-artifact@v4
        with: { name: toolchain, path: "${{ runner.temp }}" }
      - name: Unpack the toolchain
        run: |
          mkdir -p "$RUNNER_TEMP/work/out"
          tar -C "$RUNNER_TEMP/work/out" -xzf "$RUNNER_TEMP/toolchain.tar.gz"
      - name: Assemble a usable NDK, then package
        run: |
          # 拼 NDK 的活收在 tools/prepare-ndk.sh 里 —— sdk-tools 也要同一棵树，
          # 抄两份迟早长歪（manifest 解析那次的教训）。
          N=$(tools/prepare-ndk.sh "${{ inputs.ndk_version }}" \
                "$RUNNER_TEMP/work/out/llvm/linux-aarch64" "$RUNNER_TEMP/ndk" | tail -1)
          if [ "${{ inputs.verify_repro }}" = "true" ]; then
            # 打两次比 sha256。目录拷完包就删，峰值仍是一份（~3.5 GB），
            # 但时间翻倍 —— 所以做成开关，日常构建可以关掉。
            WORK="$RUNNER_TEMP/work" tools/check-reproducible.sh --ndk "$N"
          else
            WORK="$RUNNER_TEMP/work" tools/make-ndk-dist.sh --ours-only "$N"
          fi
      - uses: actions/upload-artifact@v4
        with: { name: ndk-package, path: "${{ runner.temp }}/work/android-ndk-*-ours.tar.gz" }

  sdk-tools:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 180
    # 只依赖工具链，不依赖 NDK 包 —— 所以能跟 ndk-package 并行跑。
    needs: llvm
    steps:
      # **必须检出 tag，不是 main**：SOURCE_DATE_EPOCH 默认取 HEAD 的提交时间，
      # 在 main 上打出来的包属于 main 那个 commit，跟 Release 对不上。
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.release_tag }}" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq cmake ninja-build git curl unzip zip file python3 protobuf-compiler
      - uses: actions/download-artifact@v4
        with: { name: toolchain, path: "${{ runner.temp }}" }
      - name: Assemble a usable NDK
        run: |
          # **不能解 `-ours` 那个包来编东西**：它是故意不完整的 —— sysroot 和
          # lib/clang 是 Google 分发的文件，我们不转发，由 install.sh 在装的时候
          # 从官方包补回来。run #1 就是这么红的：解开 -ours 包直接编，没有头文件
          # 和目标库，2 分钟报废。
          mkdir -p "$RUNNER_TEMP/work/out"
          tar -C "$RUNNER_TEMP/work/out" -xzf "$RUNNER_TEMP/toolchain.tar.gz"
          N=$(tools/prepare-ndk.sh "${{ inputs.ndk_version }}" \
                "$RUNNER_TEMP/work/out/llvm/linux-aarch64" "$RUNNER_TEMP/ndk" | tail -1)
          echo "ANDROID_NDK_HOME=$N" >> "$GITHUB_ENV"
      - name: Fetch sources and build each tool
        run: |
          for t in aapt2 aapt aidl dexdump split-select zipalign adb etc1tool fastboot \
                   hprof-conv make_f2fs make_f2fs_casefold mke2fs sqlite3; do
            WORK="$RUNNER_TEMP/work" tools/build-$t.sh || exit 1
          done
      - name: Package (only what we compiled)
        run: |
          # make-dist.sh 要一份**官方** SDK 借跟架构无关的那部分（d8.jar、
          # apksigner.jar、包装脚本、NOTICE.txt）。它只看 build-tools/<rev>/ 和
          # platform-tools/ 两个目录，所以直接摆出来就行，不用 sdkmanager。
          O="$RUNNER_TEMP/official-sdk"
          tools/fetch-google-package.sh "build-tools;${{ inputs.build_tools }}" "$O/bt-tmp"
          # zip 解出来的目录名是**代号**（android-16），SDK 布局要的是版本号
          mv "$(ls -d "$O"/bt-tmp/*/ | head -1)" "$O/build-tools-tmp"
          mkdir -p "$O/build-tools"
          mv "$O/build-tools-tmp" "$O/build-tools/${{ inputs.build_tools }}"
          rmdir "$O/bt-tmp"
          tools/fetch-google-package.sh "platform-tools" "$O/pt-tmp"
          mv "$O/pt-tmp/platform-tools" "$O/platform-tools"
          rmdir "$O/pt-tmp"
          # 用 check-reproducible.sh 而不是直接 make-dist.sh：它**打两次比 sha256**，
          # 产物照样留在 $WORK 里。发布包的校验和只有在能被独立复现时才有意义，
          # 所以这一步顺便就是那个证明。SDK 包铺开只有 ~100 MB，打两次的开销可以忽略。
          ANDROID_HOME="$RUNNER_TEMP/official-sdk" WORK="$RUNNER_TEMP/work" \
            tools/check-reproducible.sh
      - uses: actions/upload-artifact@v4
        with: { name: sdk-package, path: "${{ runner.temp }}/work/android-sdk-linux-arm64-*-ours.tar.gz" }

  hermesc:
    # 独立的一条：hermesc 是 React Native 那条链上的 host 工具，不吃 NDK，
    # 只要 cmake/ninja/python3。源码 238 MB、构建 32 MB，盘和时间都不是问题。
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.release_tag }}" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq clang lld cmake ninja-build git python3 file
      - name: Build hermesc
        run: WORK="$RUNNER_TEMP/work" tools/build-hermesc.sh
      - uses: actions/upload-artifact@v4
        with: { name: hermesc-package, path: "${{ runner.temp }}/work/hermesc-*-linux-aarch64.tar.gz" }

  publish:
    # 把四个包挂到 Release 上，并把 sha256 表打进 job summary ——
    # docs/RELEASE-NOTES.md 里那张表就照它填（CI 编的二进制跟本机编的不是同一批，
    # 校验和必然不同：可复现的是**打包**，不是编译）。
    needs: [llvm, ndk-package, sdk-tools, hermesc]
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write        # 只有这个 job 需要写权限；上传用自带的 GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.release_tag }}" }
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Render the release notes with the measured checksums
        run: |
          find dist -name '*.tar.gz' | sort > files.txt
          [ -s files.txt ] || { echo "no archives came back from the build jobs"; exit 1; }
          # 逻辑在脚本里，workflow 只当薄壳（跟 ci-checks 同一个道理）：
          # 这样它在本机能跑能验，而不是一段只有推上去才知道对不对的 YAML。
          xargs -a files.txt tools/render-release-notes.py \
            "${{ inputs.release_tag }}" "$(git rev-parse --short HEAD)" notes.md
          {
            echo "### Artifacts"
            echo
            sed -n '/^| File | Bytes | sha256 |/,/^$/p' notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          # 已经有（哪怕是草稿）就改它并转正；没有就新建。
          # 草稿这件事踩过：force-push 一个已发布的 tag，GitHub 会把 Release
          # 降级成草稿，匿名就看不见了。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file notes.md --draft=false
          else
            gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
          fi
          xargs -a files.txt gh release upload "$TAG" --clobber
          gh release view "$TAG" --json isDraft,assets \
            --jq '"draft=\(.isDraft)", (.assets[] | "\(.size)\t\(.name)")'
